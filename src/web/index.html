<!doctype html>
<html lang="en" data-color-mode="auto" data-light-theme="light" data-dark-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GitHub Well-Architected Enterprise Assessment</title>
<link rel="stylesheet" href="/primer.css">
<style>
  body { margin: 0; color: var(--fgColor-default); background: var(--bgColor-default); }
  .Header { color: var(--fgColor-default); background: var(--bgColor-default); border-bottom: 1px solid var(--borderColor-default); }
  .header-content { display: flex; justify-content: space-between; align-items: center; gap: 1rem; flex-wrap: wrap; }
  .header-actions, .theme-selector { display: flex; align-items: center; gap: .75rem; flex-wrap: wrap; }
  .header-actions { width: 100%; }
  .theme-selector { margin-left: auto; }
  .skip-link { position: absolute; z-index: 2; top: .5rem; left: .5rem; transform: translateY(-200%); }
  .skip-link:focus { transform: translateY(0); }
  .summary-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); gap: 1rem; }
  .pillar-card { position: relative; }
  .pillar-card:hover { border-color: var(--borderColor-accent-emphasis, var(--borderColor-default)); }
  .pillar-card-action { font: inherit; text-align: left; }
  .pillar-card-action::after { position: absolute; inset: 0; content: ''; }
  .pillar-card-guidance { position: relative; z-index: 1; }
  .score { font-size: 2rem; font-weight: 600; line-height: 1.2; }
  .ScoreProgress { display: block; width: 100%; margin: .5rem 0; }
  .UnderlineNav { overflow-x: auto; }
  .UnderlineNav-item { white-space: nowrap; }
  .table-wrap { max-width: 100%; overflow-x: auto; }
  table { width: 100%; min-width: 720px; border-collapse: collapse; }
  th, td { padding: .625rem .5rem; text-align: left; vertical-align: top; border-bottom: 1px solid var(--borderColor-muted); }
  th { color: var(--fgColor-muted); font-size: .75rem; text-transform: uppercase; }
  .filters { display: flex; align-items: end; gap: .75rem; flex-wrap: wrap; margin-bottom: 1rem; }
  .filter-control { display: grid; gap: .25rem; }
  .q { border-bottom: 1px solid var(--borderColor-muted); padding: 1rem 0; }
  .q-options { border: 0; margin: .5rem 0; padding: 0; }
  .q-options legend { margin-bottom: .25rem; }
  .q-options label { display: inline-flex; align-items: center; gap: .25rem; margin-right: .75rem; }
  .q textarea { min-height: 4rem; width: min(100%, 48rem); }
  .remediation { margin-top: .375rem; }
  .rationale { margin-top: .375rem; }
  .implementation-actions { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem; margin-top: .5rem; }
  .finding-link { min-height: 24px; text-align: left; text-decoration: underline; white-space: normal; }
  .copy-command { display: flex; align-items: flex-start; gap: .5rem; margin-top: .5rem; }
  .copy-command pre { flex: 1; margin: 0; padding: .5rem .75rem; overflow-x: auto; background: var(--bgColor-muted); border: 1px solid var(--borderColor-default); border-radius: 6px; font-size: 12px; }
  dialog { max-width: min(36rem, calc(100vw - 2rem)); border: 1px solid var(--borderColor-default); border-radius: .5rem; color: var(--fgColor-default); background: var(--bgColor-default); }
  dialog::backdrop { background: rgb(31 35 40 / 60%); }
  #finding-details-dialog { width: min(42rem, calc(100vw - 2rem)); max-width: min(42rem, calc(100vw - 2rem)); max-height: min(80vh, 48rem); overflow-y: auto; }
  .finding-details-header { position: sticky; top: 0; z-index: 1; padding-bottom: .5rem; background: var(--bgColor-default); }
  .breakdown-groups { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 16rem), 1fr)); gap: 0 1rem; }
  .breakdown-list { padding-left: 1.25rem; overflow-wrap: anywhere; }
  .implementation-form { display: grid; gap: .75rem; }
  details summary { min-height: 24px; cursor: pointer; color: var(--fgColor-muted); }
  :focus-visible { outline: 2px solid var(--focus-outlineColor); outline-offset: 2px; }
  #toast, #save-error, #load-error { position: fixed; z-index: 10; right: 1rem; bottom: 1rem; max-width: calc(100vw - 2rem); }
  #save-error, #load-error { bottom: 4rem; }
  [hidden] { display: none !important; }
  @media (max-width: 40rem) {
    .header-content { align-items: flex-start; }
    .filters { align-items: stretch; flex-direction: column; }
  }
  @media (forced-colors: active) {
    .Label { border: 1px solid currentColor; }
  }
</style>
</head>
<body>
<a class="skip-link btn btn-primary" href="#main-content">Skip to content</a>
<header class="Header">
  <div class="container-xl px-3 py-3 header-content">
    <div>
      <h1 class="h2 m-0">GitHub Well-Architected Enterprise Assessment</h1>
      <p class="color-fg-muted m-0" id="subtitle">Loading assessment…</p>
    </div>
    <div class="header-actions">
      <div class="d-flex flex-wrap gap-2" id="actions"></div>
      <div class="theme-selector">
        <label class="sr-only" for="theme-select">Theme</label>
        <select class="form-select" id="theme-select">
          <option value="system">System</option>
          <option value="light">Light</option>
          <option value="dark">Dark</option>
          <option value="high-contrast">High contrast (system)</option>
          <option value="colorblind">Colorblind (system)</option>
        </select>
        <span class="color-fg-danger text-small" id="theme-error" role="alert" hidden></span>
      </div>
    </div>
  </div>
</header>
<main class="container-xl px-3 py-4" id="main-content">
  <section class="summary-grid mb-4" id="summary" aria-label="Assessment summary"></section>
  <nav class="UnderlineNav mb-3" aria-label="Assessment views">
    <div class="UnderlineNav-body" role="tablist" aria-label="Assessment sections">
      <button type="button" class="UnderlineNav-item selected" id="tab-button-improvements" role="tab" aria-selected="true" aria-controls="tab-improvements" tabindex="0" data-tab="improvements">Improvement areas</button>
      <button type="button" class="UnderlineNav-item" id="tab-button-controls" role="tab" aria-selected="false" aria-controls="tab-controls" tabindex="-1" data-tab="controls">All controls</button>
      <button type="button" class="UnderlineNav-item" id="tab-button-questionnaire" role="tab" aria-selected="false" aria-controls="tab-questionnaire" tabindex="-1" data-tab="questionnaire">Questionnaire</button>
      <button type="button" class="UnderlineNav-item" id="tab-button-gaps" role="tab" aria-selected="false" aria-controls="tab-gaps" tabindex="-1" data-tab="gaps">Coverage gaps</button>
    </div>
  </nav>
  <section id="tab-improvements" role="tabpanel" aria-labelledby="tab-button-improvements" tabindex="0"></section>
  <section id="tab-controls" role="tabpanel" aria-labelledby="tab-button-controls" tabindex="0" hidden></section>
  <section id="tab-questionnaire" role="tabpanel" aria-labelledby="tab-button-questionnaire" tabindex="0" hidden></section>
  <section id="tab-gaps" role="tabpanel" aria-labelledby="tab-button-gaps" tabindex="0" hidden></section>
</main>
<div id="toast" class="flash flash-success" role="status" aria-live="polite" aria-atomic="true" hidden></div>
<div id="save-error" class="flash flash-error" role="alert" hidden></div>
<div id="load-error" class="flash flash-error" role="alert" hidden></div>
<dialog id="finding-details-dialog" aria-labelledby="finding-details-title">
  <div class="finding-details-header d-flex flex-justify-between flex-items-start gap-2">
    <h2 class="h3" id="finding-details-title"></h2>
    <div class="d-flex gap-2">
      <button class="btn" type="button" id="finding-details-export">Export .md</button>
      <form method="dialog"><button class="btn" type="submit">Close</button></form>
    </div>
  </div>
  <div id="finding-details-content"></div>
</dialog>
<script>
const STATIC = window.__ASSESSMENT__ || null;
let data = STATIC;
const THEME_KEY = 'github-enterprise-assessment-theme';
const THEMES = {
  system: { colorMode: 'auto', lightTheme: 'light', darkTheme: 'dark' },
  light: { colorMode: 'light', lightTheme: 'light', darkTheme: 'dark' },
  dark: { colorMode: 'dark', lightTheme: 'light', darkTheme: 'dark' },
  'high-contrast': { colorMode: 'auto', lightTheme: 'light_high_contrast', darkTheme: 'dark_high_contrast' },
  colorblind: { colorMode: 'auto', lightTheme: 'light_colorblind', darkTheme: 'dark_colorblind' },
};
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const pill = (status) => {
  const styles = { pass: 'Label--success', partial: 'Label--attention', fail: 'Label--danger' };
  return `<span class="Label ${styles[status] || 'Label--secondary'}">${esc(status.replace('_', ' '))}</span>`;
};
const pillarName = (id) => data.pillars.find((p) => p.id === id)?.name || id;
const refs = (list) => (list || []).map((u) => `<a href="${esc(u)}" rel="noopener">Well-Architected guidance</a>`).join(' · ');
const implementationGuideLink = () => STATIC ? '' : '<a href="/implementation-guide">Implementation guide</a>';
const documentationLink = (list) => {
  const url = (list || []).find((ref) => {
    try { return new URL(ref).protocol === 'https:'; } catch { return false; }
  });
  return url ? `<a href="${esc(url)}" target="_blank" rel="noopener">Documentation</a>` : '';
};
const scoreProgress = (label, score) => score == null ? '<p class="color-fg-muted">Score not available</p>'
  : `<progress class="ScoreProgress" max="100" value="${score}" aria-label="${esc(label)} score: ${score} percent"></progress>`;

function setupTheme() {
  const selector = document.getElementById('theme-select');
  const error = document.getElementById('theme-error');
  const apply = (theme) => Object.assign(document.documentElement.dataset, THEMES[theme]);
  const showError = (message) => { error.textContent = message; error.hidden = false; };
  let selected = 'system';
  try {
    const saved = localStorage.getItem(THEME_KEY);
    if (saved !== null && Object.hasOwn(THEMES, saved)) selected = saved;
    else if (saved !== null) showError('The saved theme is unavailable. Choose a theme to replace it.');
  } catch {
    showError('The saved theme could not be loaded. This browser may not save your selection.');
  }
  selector.value = selected;
  apply(selected);
  selector.addEventListener('change', () => {
    apply(selector.value);
    try {
      localStorage.setItem(THEME_KEY, selector.value);
      error.hidden = true;
    } catch {
      showError('Theme applied, but this browser could not save your selection.');
    }
  });
}

function downloadTask(control) {
    const access = data.coverageGaps.find((g) => g.id === control.id)?.access;
    const links = (control.references || []).filter((url) => {
      try { return new URL(url).protocol === 'https:'; } catch { return false; }
    });
    const markdown = [
      `# Implement ${control.id}: ${control.title}`,
      '',
      `- **Status:** ${control.status}`,
      `- **Finding:** ${control.finding}`,
      '',
      ...(access ? [
        '## Grant token access',
        '',
        'Add the missing scopes to the GitHub CLI token, then re-run collection:',
        '',
        '```sh',
        access.command,
        '```',
        '',
        ...(access.requiresRepositoryAdmin ? ['The authenticated account must also have repository administrator access.'] : []),
        ...(access.requiresOwner ? ['The authenticated account must also be an organization owner (or have the matching fine-grained permission).'] : []),
        ...(access.requiresSecurityManager ? ['The authenticated account must also have the security manager role.'] : []),
        ...((access.requiresRepositoryAdmin || access.requiresOwner || access.requiresSecurityManager) ? [''] : []),
      ] : []),
      '## Recommended change',
      '',
      control.remediation || 'Review the control guidance and define an appropriate implementation.',
      '',
      ...(control.benefits ? ['## Why implement it', '', control.benefits, ''] : []),
      ...(control.considerations ? ['## Considerations and when it may not fit', '', control.considerations, ''] : []),
      '## References',
      '',
      ...(links.length ? links.map((url) => `- ${url}`) : ['- No external references were provided for this control.']),
      '',
      '## Completion',
      '',
      '- [ ] Review the recommendation and confirm it fits the enterprise environment.',
      '- [ ] Apply the approved configuration or process change.',
      '- [ ] Re-run the assessment and verify the result.',
      '',
      'This is a manual task export; downloading it does not change GitHub settings.',
      '',
    ].join('\n');
    const file = new Blob([markdown], { type: 'text/markdown;charset=utf-8' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(file);
    link.download = `${control.id.toLowerCase()}-implementation.md`;
    link.click();
    setTimeout(() => URL.revokeObjectURL(link.href), 1000);
}

function findingText(control) {
  const breakdown = control.details?.breakdown;
  if (control.source !== 'automated' || !breakdown || (!breakdown.items?.length && !breakdown.unavailable?.length && !breakdown.truncated)) return esc(control.finding);
  const entities = breakdown.kind === 'repository' ? 'repositories' : 'organizations';
  return `<button class="btn-link finding-link" type="button" data-breakdown="${esc(control.id)}" aria-haspopup="dialog" aria-label="${esc(control.finding)} View ${entities}.">${esc(control.finding)}</button>`;
}

let detailsControl = null;

function breakdownSections(control) {
  const { kind, items, labels = {}, unavailable = [], truncated, sampled } = control.details.breakdown;
  const groups = [
    ['pass', labels.pass || 'Meets requirement'],
    ['fail', labels.fail || 'Does not meet requirement'],
    ['partial', 'Partially meets requirement'],
    ['unknown', 'Not assessed'],
    ['not_applicable', 'Not applicable'],
  ];
  const notices = [];
  if (sampled) notices.push('Only sampled repositories were assessed. Other collected repositories are listed as not assessed.');
  if (truncated) notices.push('Repository inventory was truncated by --max-repos. Increase the limit and recollect to include the rest.');
  if (unavailable.length) notices.push(`Repository inventory unavailable for: ${unavailable.join(', ')}.`);
  const sections = groups.map(([status, title]) => ({
    status, title,
    entries: items.filter((item) => item.status === status).sort((a, b) => a.name.localeCompare(b.name)),
  })).filter(({ status, entries }) => entries.length || status === 'pass' || status === 'fail');
  const scope = `Results for collected ${kind === 'repository' ? 'active repositories' : 'organizations'}.`;
  return { scope, notices, sections };
}

function showFindingDetails(control) {
  detailsControl = control;
  const { scope, notices, sections } = breakdownSections(control);
  document.getElementById('finding-details-title').textContent = `${control.id}: ${control.title}`;
  document.getElementById('finding-details-content').innerHTML = `<p>${esc(control.finding)}</p>
    <p class="color-fg-muted text-small">${esc(scope)}</p>
    ${notices.map((notice) => `<p class="color-fg-muted text-small">${esc(notice)}</p>`).join('')}
    <div class="breakdown-groups">${sections.map(({ title, entries }) => `<section><h3 class="h5 mt-3">${esc(title)} (${entries.length})</h3>${entries.length
        ? `<ul class="breakdown-list">${entries.map((item) => `<li>${esc(item.name)}${item.note ? ` — ${esc(item.note)}` : ''}</li>`).join('')}</ul>`
        : '<p class="color-fg-muted text-small">None.</p>'}</section>`).join('')}</div>`;
  document.getElementById('finding-details-dialog').showModal();
}

function exportFindingDetails(control) {
  const { scope, notices, sections } = breakdownSections(control);
  const md = (text) => String(text).replace(/([\\`*_[\]<>|#])/g, '\\$1');
  const markdown = [
    `# ${control.id}: ${md(control.title)}`,
    '',
    `- **Pillar:** ${md(pillarName(control.pillar))}`,
    `- **Finding:** ${md(control.finding)}`,
    `- **Evidence collected:** ${data.meta?.evidenceGeneratedAt ? new Date(data.meta.evidenceGeneratedAt).toISOString() : 'Unknown'}`,
    '',
    scope,
    ...(notices.length ? ['', ...notices.map((notice) => `> ${md(notice)}`)] : []),
    ...sections.flatMap(({ title, entries }) => ['', `## ${md(title)} (${entries.length})`, '',
      ...(entries.length ? entries.map((item) => `- \`${item.name}\`${item.note ? ` - ${md(item.note)}` : ''}`) : ['None.'])]),
    '',
  ].join('\n');
  const slug = `${control.id}-${control.title}`.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
  const file = new Blob([markdown], { type: 'text/markdown;charset=utf-8' });
  const link = document.createElement('a');
  link.href = URL.createObjectURL(file);
  link.download = `${slug}.md`;
  link.click();
  setTimeout(() => URL.revokeObjectURL(link.href), 1000);
}

document.getElementById('finding-details-export').addEventListener('click', () => {
  if (detailsControl) exportFindingDetails(detailsControl);
});

function bindControlActions(el) {
  el.querySelectorAll('[data-task]').forEach((button) => button.addEventListener('click', () => {
    const control = data.controls.find((item) => item.id === button.dataset.task);
    if (!control) return;
    downloadTask(control);
  }));
  el.querySelectorAll('[data-breakdown]').forEach((button) => button.addEventListener('click', () => {
    showFindingDetails(data.controls.find((item) => item.id === button.dataset.breakdown));
  }));
}

function renderSummary() {
  const m = data.meta, o = data.overall;
  const scope = [m.enterprise ? `Enterprise: ${m.enterprise}` : null, `${m.organizations.length} organization(s)`, m.evidenceGeneratedAt ? `Evidence: ${new Date(m.evidenceGeneratedAt).toLocaleString()}` : null].filter(Boolean).join(' · ');
  document.getElementById('subtitle').textContent = scope;
  const cards = [`<article class="Box p-3"><h2 class="h5 mt-0">Overall score</h2><div class="score">${o.score ?? '—'}</div>
    ${scoreProgress('Overall', o.score)}
    <p class="mb-1">${o.maturity ? `Level ${o.maturity.level}: ${esc(o.maturity.name)}` : 'Not enough data'}</p>
    <p class="color-fg-muted text-small mb-0">${o.assessedControls}/${o.applicableControls} controls assessed (${o.coverage}% coverage)</p></article>`];
  for (const p of data.pillars) {
    cards.push(`<article class="Box p-3 pillar-card"><div class="d-flex flex-justify-between flex-items-center"><h2 class="h5 m-0"><button class="btn-link pillar-card-action" type="button" data-pillar="${esc(p.id)}" aria-controls="tab-controls" aria-label="View ${esc(p.name)} controls">${esc(p.name)}</button></h2><span class="score">${p.score ?? '—'}</span></div>
      ${scoreProgress(p.name, p.score)}
      <p class="text-small mb-1">${p.maturity ? esc(p.maturity.name) : 'Not assessed'} · ${p.coverage}% coverage</p>
      <p class="text-small color-fg-muted mb-0">${['pass','partial','fail','unknown','unanswered'].filter((s) => p.counts[s]).map((s) => `${p.counts[s]} ${s.replace('_', ' ')}`).join(' · ') || 'No assessed controls'}</p>
      <a class="pillar-card-guidance text-small" href="${esc(p.url)}" aria-label="${esc(p.name)} Well-Architected guidance">Well-Architected guidance</a></article>`);
  }
  const summary = document.getElementById('summary');
  summary.innerHTML = cards.join('');
  summary.querySelectorAll('[data-pillar]').forEach((button) => button.addEventListener('click', () => {
    document.getElementById('f-pillar').value = button.dataset.pillar;
    renderControls();
    activateTab(document.getElementById('tab-button-controls'));
    const panel = document.getElementById('tab-controls');
    panel.focus({ preventScroll: true });
    panel.scrollIntoView({ block: 'start' });
  }));
}

function rationale(c) {
  return `${c.benefits ? `<div class="rationale"><strong>Why implement it:</strong> ${esc(c.benefits)}</div>` : ''}${c.considerations ? `<div class="rationale"><strong>Considerations / when it may not fit:</strong> ${esc(c.considerations)}</div>` : ''}`;
}

function renderImprovements() {
  const el = document.getElementById('tab-improvements');
  if (!data.improvements.length) { el.innerHTML = '<h2 class="h3">Improvement areas</h2><p class="color-fg-muted">No improvement areas identified among assessed controls.</p>'; return; }
  const rows = data.improvements.map((c, i) => {
    const control = data.controls.find((item) => item.id === c.id);
    return `<tr><td>${i + 1}</td><td><strong>${esc(c.id)}</strong><br>${esc(c.title)}</td><td>${esc(pillarName(c.pillar))}<br><span class="color-fg-muted text-small">${esc(c.area)}</span></td><td>${pill(c.status)}</td><td><span class="Label ${c.severity === 'High' ? 'Label--danger' : c.severity === 'Medium' ? 'Label--attention' : 'Label--secondary'}">${esc(c.severity)}</span></td>
      <td>${findingText(control || c)}<div class="remediation"><strong>Recommendation:</strong> ${esc(c.remediation)}</div>${rationale(c)}<div class="implementation-actions">
        <button class="btn btn-sm" type="button" data-task="${esc(c.id)}" aria-label="Download task for ${esc(c.id)}: ${esc(c.title)}">Download task</button>
        <span class="color-fg-muted text-small">Manual implementation or task export only</span>
        ${documentationLink(c.references)} ${implementationGuideLink()}</div></td></tr>`;
  }).join('');
  el.innerHTML = `<h2 class="h3">Improvement areas</h2><p class="color-fg-muted">Ranked by priority (control weight × gap). Address High severity failures first. The dashboard only downloads tasks and never changes GitHub settings.</p><div class="table-wrap" role="region" aria-label="Improvement areas table" tabindex="0"><table><thead><tr><th scope="col">#</th><th scope="col">Control</th><th scope="col">Pillar</th><th scope="col">Status</th><th scope="col">Severity</th><th scope="col">Finding &amp; recommendation</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  bindControlActions(el);
}

function renderControls() {
  const el = document.getElementById('tab-controls');
  const pf = el.querySelector('#f-pillar')?.value || '', sf = el.querySelector('#f-status')?.value || '';
  const rows = data.controls.filter((c) => (!pf || c.pillar === pf) && (!sf || c.status === sf));
  const statuses = [...new Set(data.controls.map((c) => c.status))];
  el.innerHTML = `<h2 class="h3">All controls</h2><div class="filters">
    <label class="filter-control" for="f-pillar">Pillar<select class="FormControl-select" id="f-pillar"><option value="">All pillars</option>${data.pillars.map((p) => `<option value="${esc(p.id)}" ${p.id === pf ? 'selected' : ''}>${esc(p.name)}</option>`).join('')}</select></label>
    <label class="filter-control" for="f-status">Status<select class="FormControl-select" id="f-status"><option value="">All statuses</option>${statuses.map((s) => `<option value="${esc(s)}" ${s === sf ? 'selected' : ''}>${esc(s.replace('_', ' '))}</option>`).join('')}</select></label>
    <span class="color-fg-muted" id="control-count" role="status" aria-live="polite">${rows.length} controls</span></div>
    <div class="table-wrap" role="region" aria-label="Controls table" tabindex="0"><table><thead><tr><th scope="col">Control</th><th scope="col">Pillar / area</th><th scope="col">Type</th><th scope="col">Weight</th><th scope="col">Status</th><th scope="col">Finding</th></tr></thead><tbody>${
    rows.map((c) => `<tr><td><strong>${esc(c.id)}</strong><br>${esc(c.title)}</td><td>${esc(pillarName(c.pillar))}<br><span class="color-fg-muted text-small">${esc(c.area)}</span></td><td>${esc(c.source)}</td><td>${c.weight}</td><td>${pill(c.status)}</td>
      <td>${findingText(c)}${c.notes ? `<div class="text-small color-fg-muted">Notes: ${esc(c.notes)}</div>` : ''}<details><summary>Recommendation</summary>${esc(c.remediation)}${rationale(c)}<div class="text-small">${refs(c.references)}</div></details>
        ${c.status === 'pass' || c.status === 'not_applicable' ? '' : `<div class="implementation-actions"><button class="btn btn-sm" type="button" data-task="${esc(c.id)}" aria-label="Download task for ${esc(c.id)}: ${esc(c.title)}">Download task</button>
        <span class="color-fg-muted text-small">Manual implementation or task export only</span>
        ${documentationLink(c.references)} ${implementationGuideLink()}</div>`}</td></tr>`).join('')
  }</tbody></table></div>`;
  bindControlActions(el);
  for (const id of ['f-pillar', 'f-status']) {
    el.querySelector(`#${id}`).addEventListener('change', () => {
      renderControls();
      el.querySelector(`#${id}`).focus();
    });
  }
}

function renderQuestionnaire() {
  const el = document.getElementById('tab-questionnaire');
  const qs = data.controls.filter((c) => c.type === 'manual' || c.status === 'unknown' || c.source === 'manual-override');
  const intro = STATIC ? '<p class="color-fg-muted">Static report — run <code>gh-waf-assess serve</code> to answer questions interactively.</p>'
    : '<p class="color-fg-muted">Answer process and practice questions that the API cannot observe. Unknown automated controls can also be answered manually. Answers are saved locally to your answers file. To start from saved answers, use Load answers.json above. Imported entries replace matching answers and notes; other answers and collected evidence are kept.</p>';
  el.innerHTML = '<h2 class="h3">Questionnaire</h2>' + intro + data.pillars.map((p) => {
    const items = qs.filter((c) => c.pillar === p.id);
    if (!items.length) return '';
    return `<h3>${esc(p.name)}</h3>` + items.map((c) => {
      const current = c.source === 'automated' && c.status === 'unknown' ? '' : ({ pass: 'yes', partial: 'partial', fail: 'no', not_applicable: 'na' }[c.status] || '');
      const question = c.question || `${c.title}? (Automated check could not run: ${c.automatedFinding || c.finding})`;
      const questionId = `question-${esc(c.id)}`;
      const noteId = `notes-${esc(c.id)}`;
      return `<article class="q" data-id="${esc(c.id)}"><p id="${questionId}" class="mb-2"><strong>${esc(c.id)}</strong> ${pill(c.status)} — ${esc(question)}</p>
        <fieldset class="q-options"><legend class="sr-only">${esc(c.id)} assessment response</legend><div>${['yes','partial','no','na'].map((a) => `<label><input class="FormControl-radio" type="radio" name="a-${esc(c.id)}" value="${a}" aria-describedby="${questionId}" ${current === a ? 'checked' : ''} ${STATIC ? 'disabled' : ''}> ${a === 'na' ? 'Not applicable' : a[0].toUpperCase() + a.slice(1)}</label>`).join('')}</div></fieldset>
        <label for="${noteId}">Notes / evidence (optional)</label><textarea class="FormControl-input d-block mt-1" id="${noteId}" aria-describedby="${questionId}" ${STATIC ? 'disabled' : ''}>${esc(c.notes)}</textarea></article>`;
    }).join('');
  }).join('');
  if (STATIC) return;
  el.querySelectorAll('.q').forEach((q) => {
    const save = async () => {
      const answer = q.querySelector('input:checked')?.value;
      if (!answer) return;
      const toast = document.getElementById('toast');
      const error = document.getElementById('save-error');
      try {
        const res = await fetch('/api/answers', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id: q.dataset.id, answer, notes: q.querySelector('textarea').value }) });
        if (!res.ok) throw new Error('Answer could not be saved.');
        data = await res.json();
        renderSummary(); renderImprovements(); renderControls(); renderGaps();
        error.hidden = true;
        toast.textContent = 'Answer saved locally.';
        toast.hidden = false;
        setTimeout(() => { toast.hidden = true; }, 3500);
      } catch {
        error.textContent = 'Unable to save this answer. Check the local server connection and try again.';
        error.hidden = false;
      }
    };
    q.querySelectorAll('input').forEach((i) => i.addEventListener('change', save));
    q.querySelector('textarea').addEventListener('blur', save);
  });
}

function copyCommand(command, label) {
  return `<div class="copy-command"><pre><code>${esc(command)}</code></pre><button class="btn btn-sm" type="button" data-copy="${esc(command)}" aria-label="Copy ${esc(label)}">Copy</button></div>`;
}

function accessHelp(access, intro) {
  if (!access) return '';
  return `<div class="remediation"><strong>${intro}</strong> add the <code>${access.scopes.map(esc).join('</code>, <code>')}</code> scope${access.scopes.length > 1 ? 's' : ''} to your GitHub CLI token, then re-run collection.
    ${copyCommand(access.command, 'gh auth refresh command')}
    <p class="color-fg-muted text-small mb-0">${access.requiresRepositoryAdmin ? 'The authenticated account must also have repository administrator access. ' : ''}${access.requiresOwner ? 'The authenticated account must also be an organization owner (or have the matching fine-grained permission). ' : ''}${access.requiresSecurityManager ? 'The authenticated account must also have the security manager role. ' : ''}If <code>GH_TOKEN</code> or <code>GITHUB_TOKEN</code> is set, it takes precedence over the gh CLI token; update that token instead or unset it.</p></div>`;
}

function bindCopyButtons(el) {
  el.querySelectorAll('[data-copy]').forEach((button) => button.addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(button.dataset.copy);
      button.textContent = 'Copied';
    } catch {
      button.textContent = 'Copy failed';
    }
    setTimeout(() => { button.textContent = 'Copy'; }, 2000);
  }));
}

function renderGaps() {
  const el = document.getElementById('tab-gaps');
  if (!data.coverageGaps.length) { el.innerHTML = '<h2 class="h3">Coverage gaps</h2><p class="color-fg-muted">Every applicable control has been assessed.</p>'; return; }
  el.innerHTML = `<h2 class="h3">Coverage gaps</h2><p class="color-fg-muted">These controls are excluded from scores until evidence is available. Grant the token more scopes, re-run collection, or answer them in the questionnaire.</p>
    ${accessHelp(data.coverageAccess, 'To fill the permission-related gaps at once,')}
    <div class="table-wrap" role="region" aria-label="Coverage gaps table" tabindex="0"><table><thead><tr><th scope="col">Control</th><th scope="col">Pillar</th><th scope="col">Status</th><th scope="col">Reason</th></tr></thead><tbody>${
    data.coverageGaps.map((g) => {
      const control = data.controls.find((item) => item.id === g.id);
      return `<tr><td><strong>${esc(g.id)}</strong><br>${esc(g.title)}</td><td>${esc(pillarName(g.pillar))}</td><td>${pill(g.status)}</td><td>${findingText(control || g)}
        ${accessHelp(g.access, 'To fix,')}
        <div class="implementation-actions"><button class="btn btn-sm" type="button" data-task="${esc(g.id)}" aria-label="Download task for ${esc(g.id)}: ${esc(g.title)}">Download task</button>
        <span class="color-fg-muted text-small">Manual evidence review or task export only</span>
        ${documentationLink(control?.references)} ${implementationGuideLink()}</div></td></tr>`;
    }).join('')}</tbody></table></div>`;
  bindControlActions(el);
  bindCopyButtons(el);
}

function renderActions() {
  document.getElementById('actions').innerHTML = STATIC ? `<span class="color-fg-muted text-small">Generated ${new Date(data.meta.assessedAt).toLocaleString()}</span>`
    : `<a class="btn" href="/api/report.md" download="assessment.md">Download Markdown</a> <a class="btn" href="/api/report.html" download="assessment.html">Download HTML</a> <a class="btn" href="/api/assessment" download="assessment.json">Download JSON</a>
      <button class="btn" type="button" id="import-answers">Load answers.json</button>
      <input type="file" id="answers-file" accept=".json,application/json" aria-label="Answers JSON file" hidden>`;
  if (STATIC) return;
  const button = document.getElementById('import-answers');
  const input = document.getElementById('answers-file');
  button.addEventListener('click', () => input.click());
  input.addEventListener('change', async () => {
    const file = input.files[0];
    if (!file) return;
    const error = document.getElementById('load-error');
    const toast = document.getElementById('toast');
    button.disabled = true;
    error.hidden = true;
    toast.hidden = true;
    try {
      if (file.size > 64 * 1024) throw new Error('Answers file must be 64 KiB or smaller.');
      const body = await file.text();
      const response = await fetch('/api/answers/import', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body });
      if (!response.ok) throw new Error(await response.text());
      data = await response.json();
      renderSummary(); renderImprovements(); renderControls(); renderQuestionnaire(); renderGaps();
      activateTab(document.getElementById('tab-button-questionnaire'));
      toast.textContent = 'Answers loaded and saved locally.';
      toast.hidden = false;
      setTimeout(() => { toast.hidden = true; }, 3500);
    } catch (err) {
      error.textContent = `Unable to load answers: ${err.message}`;
      error.hidden = false;
    } finally {
      button.disabled = false;
      input.value = '';
    }
  });
}

const tabButtons = [...document.querySelectorAll('[role="tab"]')];
function activateTab(button, moveFocus = false) {
  for (const tab of tabButtons) {
    const selected = tab === button;
    tab.setAttribute('aria-selected', String(selected));
    tab.tabIndex = selected ? 0 : -1;
    tab.classList.toggle('selected', selected);
    document.getElementById(tab.getAttribute('aria-controls')).hidden = !selected;
  }
  if (moveFocus) button.focus();
}
for (const button of tabButtons) {
  button.addEventListener('click', () => activateTab(button));
  button.addEventListener('keydown', (event) => {
    const index = tabButtons.indexOf(button);
    const next = event.key === 'ArrowRight' ? (index + 1) % tabButtons.length
      : event.key === 'ArrowLeft' ? (index - 1 + tabButtons.length) % tabButtons.length
        : event.key === 'Home' ? 0 : event.key === 'End' ? tabButtons.length - 1 : -1;
    if (next >= 0) {
      event.preventDefault();
      activateTab(tabButtons[next], true);
    }
  });
}

setupTheme();
(async () => {
  try {
    if (!data) {
      const response = await fetch('/api/assessment');
      if (!response.ok) throw new Error('Assessment could not be loaded.');
      data = await response.json();
    }
    renderActions(); renderSummary(); renderImprovements(); renderControls(); renderQuestionnaire(); renderGaps();
  } catch {
    const error = document.getElementById('load-error');
    error.textContent = 'Unable to load the assessment. Check the local server and refresh the page.';
    error.hidden = false;
  }
})();
</script>
</body>
</html>
